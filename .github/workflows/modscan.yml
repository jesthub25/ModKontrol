name: modscan
on:
  push:
    branches: [ci-modscan]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Scan mods
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 modscan.py modscan.json 1600 2>&1 | tee modscan.log
      - name: Publish
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-modscan-out
          git rm -rf -q --cached .
          git add -f modscan.json modscan.log || git add -f modscan.log
          git commit -q -m "modscan output"
          git push -f origin ci-modscan-out
